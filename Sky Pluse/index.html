
<!DOCTYPE html>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Weather App</title>
    <!-- linking Style -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>

    <section>
        <!-- APP STRUCTURE -->
        <div class="app">
            <h1>SkyPulse 🌤</h1>
            <p class="credit">By Yousuf</p>

            <!-- Search Bar -->
            <div class="search">
                <input type="text" id="cityInput" placeholder="Enter City Name">

                <div id="history"></div>

                <button onclick="getWeather()">Search</button>
            </div>

            <!-- Weather Details -->
            <div class="weather">
                <h2 id="city">City</h2>
                <p id="loading">Loading weather...</p>
                <img id="weatherIcon" src="https://cdn-icons-png.flaticon.com/512/1163/1163624.png" alt="weather icon" />
                <p id="feelsLike">Feels like: -- °C</p>
                <p id="temp">-°C</p>
                <p id="desc">---</p>
            </div>

        </div>
    </section>
